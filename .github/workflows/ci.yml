name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-22.04      # o ubuntu-latest (26.04) não tem mais o Python 3.8 no setup-python
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s plus/tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning -x build.sh tests/docker/*.sh
      - run: shellcheck --severity=warning -x plus/build.sh plus/tests/docker/*.sh plus/tests/render/run.sh
      - run: python3 -m pip install ruff && ruff check --select E9,F src tests plus/src plus/tests

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:8", "rockylinux:9", "almalinux:10", "oraclelinux:9"]
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/run-matrix.sh ${{ matrix.image }}

  integration-plus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:8", "rockylinux:9", "almalinux:10", "oraclelinux:9"]
    steps:
      - uses: actions/checkout@v4
      - run: plus/tests/docker/run-matrix.sh ${{ matrix.image }}

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/systemd-test.sh rockylinux:9 almalinux:10

  systemd-plus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: plus/tests/docker/systemd-test.sh rockylinux:9 almalinux:10
