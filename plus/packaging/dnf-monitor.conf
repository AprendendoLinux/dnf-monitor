# ============================================================================
#  DNF Monitor Plus — configuração
# ============================================================================
#  Depois de editar:   sudo systemctl reload dnf-monitor-plus   (ou restart)
#  Validar:            sudo dnf-monitor-plus --check-config
#  Testar o envio:     sudo dnf-monitor-plus --test-notify
#
#  Regras do arquivo
#   * Comentários começam com # ou ; (também no fim da linha, depois de um espaço).
#   * Listas (CHAT_IDS, RECIPIENT_EMAILS...) são separadas por vírgula.
#   * Verdadeiro/falso: true/false (também aceita yes/no, sim/não, on/off, 1/0).
#   * Valores de exemplo (seu_bot_token_aqui, smtp.seuservidor.com...) contam como
#     "não configurado". Se nenhum canal de ADMINISTRADOR for válido, o serviço
#     não inicia (código 78) e o systemd não fica reiniciando em loop.
#   * Este arquivo guarda senhas: o modo é 0600 (só o root lê). Mantenha assim.
#
#  Quem recebe o quê
#   ADMINISTRADORES ([Telegram] e [Email])    -> alertas na hora: atualização disponível,
#                                                kernel, segurança, lembrete, reinício.
#   CLIENTE ([ClientTelegram] e [ClientEmail]) -> só o relatório diário (veja o fim do arquivo).
# ============================================================================


# ----------------------------------------------------------------------------
#  [Telegram] — bot dos ADMINISTRADORES
# ----------------------------------------------------------------------------
[Telegram]
# Token do bot, criado no @BotFather (ex.: 123456789:AAE...). O prefixo "bot" é opcional.
# Em branco = Telegram desativado.
BOT_TOKEN=seu_bot_token_aqui
# IDs dos chats que recebem os alertas, separados por vírgula. Grupos têm ID negativo.
# Como descobrir: https://github.com/AprendendoLinux/dnf-monitor/blob/main/docs/telegram.md
CHAT_IDS=12345678, 87654321
# Opcional: servidor da Bot API (padrão: https://api.telegram.org). Útil com Bot API própria.
#API_BASE=https://api.telegram.org


# ----------------------------------------------------------------------------
#  [Monitor] — como e quando verificar
# ----------------------------------------------------------------------------
[Monitor]
# Intervalo entre as verificações completas, em horas (aceita decimais: 0.5 = 30 min; mínimo 1 min).
# Além disso o Plus reage em ~1 minuto quando o DNF baixa metadados novos ou instala pacotes.
CHECK_INTERVAL_HOURS=4
# Repete o alerta a cada N dias enquanto houver pendências (0 = nunca repete).
REMINDER_DAYS=0
# Avisa os administradores quando todas as atualizações forem instaladas (true/false).
NOTIFY_ON_CLEAR=false
# Atualiza os metadados dos repositórios a cada verificação, como "dnf makecache --refresh" (true/false).
# Use false para confiar só no cache existente (dnf-makecache.timer etc.).
UPDATE_CACHE=true
# Um repositório fora do ar não impede o monitoramento dos demais (true/false).
SKIP_BROKEN_REPOS=true
# Carrega os plugins do DNF (versionlock etc.), como o comando dnf faz (true/false).
LOAD_DNF_PLUGINS=true
# Tempo máximo da consulta ao DNF, em minutos (mínimo 0.5).
COLLECT_TIMEOUT_MINUTES=15
# Interfaces de rede ignoradas na lista de IPs que aparece nas mensagens (aceita * e ?).
IGNORE_INTERFACES=lo,docker*,br-*,veth*,virbr*,cni*,flannel*,cali*,tun*,tap*,podman*
# Arquivo de log (em branco = só stdout/journal) e de estado ("o que já foi avisado").
#LOG_FILE=/var/log/dnf-monitor-plus.log
#STATE_FILE=/var/lib/dnf-monitor-plus/state.json


# ----------------------------------------------------------------------------
#  [Email] — e-mail dos ADMINISTRADORES (SMTP)
# ----------------------------------------------------------------------------
[Email]
# Servidor SMTP. Em branco (ou remova a seção) = e-mail desativado.
SMTP_SERVER=smtp.seuservidor.com
# Porta: 587 (STARTTLS), 465 (SSL) ou 25/2525 (relay local).
SMTP_PORT=587
# auto     = porta 465 usa SSL; demais portas usam STARTTLS quando o servidor oferece, e
#            o programa RECUSA enviar usuário/senha sem criptografia.
# ssl | starttls = força o modo.
# none     = sem criptografia (só para relays locais confiáveis).
SMTP_SECURITY=auto
# Usuário e senha. Deixe SMTP_USER vazio para servidores sem autenticação (ex.: Postfix local).
SMTP_USER=alerta@seuservidor.com
SMTP_PASS=sua_senha_segura
# Nome e endereço que aparecem como remetente (SENDER_EMAIL padrão = SMTP_USER).
SENDER_NAME=APT Monitor
SENDER_EMAIL=alerta@seuservidor.com
# Destinatários, separados por vírgula. Cada um recebe a sua própria mensagem.
RECIPIENT_EMAILS=admin@seuservidor.com, suporte@seuservidor.com


# >>> DNF Monitor Plus >>> (daqui para baixo: relatório diário ao CLIENTE) >>>
#
# O CLIENTE não recebe alertas: recebe UM relatório por dia dizendo quantas vezes o
# administrador atualizou o servidor e o total de pacotes (com sucesso e com falha).
# Atualizações do dnf-automatic não entram. Para ativar, preencha pelo menos um
# canal do cliente ([ClientTelegram] e/ou [ClientEmail]) com um bot/endereços DIFERENTES
# dos dos administradores. Sem nenhum canal de cliente, nada é enviado a ele.

# ----------------------------------------------------------------------------
#  [Report] — quando e o que vai no relatório
# ----------------------------------------------------------------------------
[Report]
# Nome que aparece no relatório: "O administrador <ADMIN_NAME> atualizou o servidor...".
# Em branco: "A equipe técnica atualizou o servidor...".
#ADMIN_NAME=Henrique Fagundes
# Horário (HH:MM, 24 h) e fuso em que o relatório sai. Padrões: 22:30 e America/Sao_Paulo.
# O fuso é um nome da base tz (ls /usr/share/zoneinfo). Ex.: America/Manaus, UTC.
#REPORT_TIME=22:30
#REPORT_TIMEZONE=America/Sao_Paulo
# Pendência antiga: se algum pacote espera instalação há MAIS de N dias, o relatório do dia
# lista todos os pendentes e sugere falar com o administrador (sem citar nomes), mesmo em dia
# sem nenhuma atualização. Repete todo dia até serem instalados. 0 = desativa. Padrão: 3.
#PENDING_ALERT_DAYS=3
# true: envia relatório até em dia sem atualização e sem pendência antiga. Padrão: false.
#SEND_EMPTY=false
# true: o relatório por e-mail traz a tabela de pacotes (nome e versões). Padrão: true.
#PACKAGE_LIST=true
# Banco de histórico (SQLite). Padrão abaixo.
#DB_FILE=/var/lib/dnf-monitor-plus/history.db

# ----------------------------------------------------------------------------
#  [ClientTelegram] — bot do CLIENTE (diferente do bot dos administradores)
# ----------------------------------------------------------------------------
[ClientTelegram]
#BOT_TOKEN=seu_bot_token_aqui
#CHAT_IDS=12345678
#API_BASE=https://api.telegram.org

# ----------------------------------------------------------------------------
#  [ClientEmail] — e-mail do CLIENTE (mesmas chaves de [Email])
# ----------------------------------------------------------------------------
[ClientEmail]
#SMTP_SERVER=smtp.seuservidor.com
#SMTP_PORT=587
#SMTP_SECURITY=auto
#SMTP_USER=alerta@seuservidor.com
#SMTP_PASS=sua_senha_segura
#SENDER_NAME=APT Monitor
#SENDER_EMAIL=alerta@seuservidor.com
#RECIPIENT_EMAILS=cliente@empresa.com.br
